name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
  
  build:
    name: Build docker image
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cicd-sg:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke test - start container
        run: docker run -d --name smoke -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --memory 256m cicd-sg:${{ github.sha }}

      - name: Smoke test - check / health endpoint
        run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8000/health

      - name: Smoke test - check non-root user
        run: test "$(docker exec smoke whoami)" = "appuser"  

      - name: Save image as tarball
        run: docker save cicd-sg:${{ github.sha}} -o ${{ runner.temp }}/image.tar
        
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

      - name: Show container logs
        if: always()
        run: docker logs smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f smoke || true
 
  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '0'

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Fail on CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: '1'  

  push-image:
    name: Push to GHCR
    runs-on: ubuntu-24.04
    needs: security-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: ${{ runner.temp }}

      - name: Load image
        run: docker load --input "${{ runner.temp }}/image.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        id: push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "cicd-sg:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "cicd-sg:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")
          DIGEST="${DIGEST#*@}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Could not determine image digest"; exit 1; }
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`${IMAGE}:${GITHUB_SHA}\` and \`${IMAGE}:latest\` (digest \`${DIGEST}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: ${{ runner.temp }}/image.tar
          format: cyclonedx
          output: sbom.cdx.json

      - name: Attest SBOM
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: push-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      IMAGE_TAG: ${{ github.sha }}
      IMAGE: ghcr.io/kallai-st/cicd-sg
      IMAGE_DIGEST: ${{ needs.push-image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Verify image signature and SBOM attestation
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Missing or invalid image digest"; exit 1; }
          IDENTITY="https://github.com/Kallai-st/cicd-sg/.github/workflows/ci-cd.yml@refs/heads/main"
          ISSUER="https://token.actions.githubusercontent.com"
          cosign verify --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "${IMAGE}@${IMAGE_DIGEST}" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" "${IMAGE}@${IMAGE_DIGEST}" > /dev/null
          echo "Verified signature and SBOM attestation of \`${IMAGE}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${DEPLOY_HOST}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy compose file
        run: |
          ssh deploy-target 'mkdir -p ~/cicd-sg'
          scp deploy/docker-compose.yml deploy-target:cicd-sg/docker-compose.yml

      - name: Record previous version
        id: previous
        run: |
          PREV_TAG=$(ssh deploy-target "sed -n 's/^IMAGE_TAG=//p' ~/cicd-sg/.env 2>/dev/null" || true)
          PREV_DIGEST=$(ssh deploy-target "sed -n 's/^IMAGE_DIGEST=//p' ~/cicd-sg/.env 2>/dev/null" || true)
          # Only accept a full commit SHA and a full digest; anything else means "no usable previous version"
          if [[ ! "$PREV_TAG" =~ ^[0-9a-f]{40}$ || ! "$PREV_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            PREV_TAG=""
            PREV_DIGEST=""
          fi
          echo "tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "digest=${PREV_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Previous version: ${PREV_TAG:-none (first deployment)} ${PREV_DIGEST}"

      - name: Deploy with Docker Compose
        run: |
          ssh deploy-target "cd ~/cicd-sg && printf 'IMAGE_TAG=%s\nIMAGE_DIGEST=%s\n' '${IMAGE_TAG}' '${IMAGE_DIGEST}' > .env && docker compose pull && docker compose up -d --wait --wait-timeout 120 && docker image prune -f"

      - name: Verify deployment
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "http://${DEPLOY_HOST}/health"
          echo
          RUNNING=$(ssh deploy-target "docker inspect --format '{{.Config.Image}}' cicd-sg")
          echo "Running image: ${RUNNING}"
          [[ "$RUNNING" == "${IMAGE}@${IMAGE_DIGEST}" ]] || { echo "::error::Running image does not match the verified digest"; exit 1; }
          echo "Deployed \`${IMAGE}@${IMAGE_DIGEST}\` (commit \`${IMAGE_TAG}\`) to http://${DEPLOY_HOST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Show container status on failure
        if: failure()
        run: ssh deploy-target "cd ~/cicd-sg && docker compose ps && docker compose logs --tail 50"

      - name: Roll back to previous version
        if: failure() && steps.previous.outputs.tag != ''
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.digest }}
        run: |
          echo "::warning::Deployment of ${IMAGE_TAG} failed - rolling back to ${PREVIOUS_TAG}"
          ssh deploy-target "cd ~/cicd-sg && printf 'IMAGE_TAG=%s\nIMAGE_DIGEST=%s\n' '${PREVIOUS_TAG}' '${PREVIOUS_DIGEST}' > .env && docker compose pull && docker compose up -d --wait --wait-timeout 120"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "http://${DEPLOY_HOST}/health"
          echo
          echo "Rolled back from \`${IMAGE_TAG}\` to \`${PREVIOUS_TAG}\` (\`${PREVIOUS_DIGEST}\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key